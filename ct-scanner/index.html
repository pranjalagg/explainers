<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CT scanner</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><script>(()=>{const mq=matchMedia("(prefers-color-scheme: dark)");const set=()=>{document.body.dataset.theme=mq.matches?"dark":"light";document.documentElement.style.colorScheme=mq.matches?"dark":"light";};set();mq.addEventListener("change",set);})()</script><main class="iso-page"><style>.iso{
  --ct-bore:#060606;--ct-face:#1d1d20;--ct-tube:#d7d7dc;--ct-beam:#ffd36b;--ct-cell:#ffe08a;
  --ct-patient:#6b5649;--ct-led:#3a3a3e;--ct-led-on:#ff6b5b;--ct-canvas:#0d0d0e;
}
.iso[data-theme="light"]{
  --ct-bore:#2b2b2f;--ct-face:#fbfbf9;--ct-tube:#ffffff;--ct-beam:#f0a92a;--ct-cell:#f5b22e;
  --ct-patient:#e6c5ad;--ct-led:#cfcfd2;--ct-led-on:#e5484d;--ct-canvas:#ececea;
}
.ct-bore{fill:var(--ct-bore)}
.ct-face{fill:var(--ct-face);fill-rule:evenodd}
.ct-beam{fill:var(--ct-beam);fill-opacity:.42;stroke:none}
.ct-tube{fill:var(--ct-tube);stroke:var(--anatomy-hi);stroke-width:.5}
.ct-cell{fill:var(--ct-cell);stroke:var(--anatomy-lo);stroke-width:.35;transition:opacity .08s linear}
.ct-patient{fill:var(--ct-patient)}
.ct-led{fill:var(--ct-led);transition:fill .2s}
.ct-led[data-on]{fill:var(--ct-led-on)}
.ct-stage{outline:none}
.ct-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}

.ct-controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:28px 0 18px}
.ct-play,.ct-step{font:11px/1 var(--anatomy-mono);letter-spacing:.04em;color:var(--anatomy-muted);background:transparent;border:0;box-shadow:0 0 0 1px var(--anatomy-faint);padding:8px 10px 7px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:color .2s,box-shadow .2s}
.ct-play:hover,.ct-step:hover{color:var(--anatomy-text);box-shadow:0 0 0 1px var(--anatomy-mid)}
.ct-play:focus-visible,.ct-step:focus-visible,.ct-scrub input:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:2px}
.ct-step span{color:var(--anatomy-lo)}
.ct-step[aria-pressed="true"]{color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-hi)}
.ct-step[aria-pressed="true"] span{color:var(--anatomy-mid)}
.ct-play{color:var(--anatomy-strong)}
.ct-steps{display:flex;flex-wrap:wrap;gap:6px}
.ct-scrub{display:flex;align-items:center;gap:10px;flex:1 1 200px;min-width:0;font:11px var(--anatomy-mono);color:var(--anatomy-muted)}
.ct-scrub input{flex:1;min-width:0;accent-color:var(--anatomy-hi)}

.ct-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.ct-card{margin:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-faint);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.ct-card figcaption{font:11px/1.4 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--anatomy-muted)}
.ct-profile{display:block;width:100%;height:110px;background:var(--ct-canvas)}
.ct-profile polyline{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke}
.ct-sino{display:block;width:100%;height:auto;aspect-ratio:96/180;image-rendering:pixelated;background:var(--ct-canvas)}
.ct-recon-wrap{position:relative;width:100%;max-width:300px;aspect-ratio:1;justify-self:center;cursor:crosshair}
.ct-recon{display:block;width:100%;height:100%;image-rendering:pixelated;background:var(--ct-canvas)}
.ct-probe{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid var(--ct-led-on);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #00000040}
.ct-probe[hidden]{display:none}
.ct-hu{margin:0;min-height:2.6em;font:12px/1.5 var(--anatomy-mono);color:var(--anatomy-text)}
.ct-note{margin:0;font-size:12px;line-height:1.5;color:var(--anatomy-muted)}

.ct-scale{list-style:none;display:flex;flex-wrap:wrap;gap:8px 20px;padding:0;margin:20px 0 0;font:12px var(--anatomy-mono);color:var(--anatomy-text)}
.ct-scale li{display:flex;align-items:center;gap:8px}
.ct-scale b{font-weight:500;color:var(--anatomy-strong)}
.ct-swatch{display:inline-block;width:14px;height:14px;box-shadow:0 0 0 1px var(--anatomy-faint)}
.ct-swatch[data-v="air"]{background:#000}
.ct-swatch[data-v="fat"]{background:#262626}
.ct-swatch[data-v="soft"]{background:#808080}
.ct-swatch[data-v="bone"]{background:#ffffff}

@media (prefers-reduced-motion:reduce){.ct-cell,.ct-led{transition:none}}
@media (max-width:560px){.iso-plate{overflow:hidden}}

// CT scan: the pure model. The slice is a simulated phantom on the unit disc (not a patient).
// Attenuation is measured in Hounsfield units plus 1000, so air is 0 and water is 1000.
const N_ANG = 180;
const N_BIN = 96;
const GRID = 72;
const DS = 0.01;
const BIN = (2 * 1) / N_BIN;
const HU = { air: -1000, fat: -90, soft: 40, lung: -750, bone: 900, lesion: 90 };
const WINDOW = { level: 40, width: 400 };

const STAGES = [
  { key: "lie", label: "Lie down", dur: 3 },
  { key: "rotate", label: "Rotate and measure", dur: 8 },
  { key: "sino", label: "Sinogram", dur: 3 },
  { key: "recon", label: "Reconstruct", dur: 6 },
  { key: "read", label: "Read the slice", dur: 5 },
];
const STARTS = STAGES.reduce((list, stage, i) => (list.push(i ? list[i - 1] + STAGES[i - 1].dur : 0), list), []);
const TOTAL = STARTS[STARTS.length - 1] + STAGES[STAGES.length - 1].dur;
const ROTATE = { from: STARTS[1], to: STARTS[1] + STAGES[1].dur };
const RECON = { from: STARTS[3], to: STARTS[3] + STAGES[3].dur };
const TABLE = { in: [0, 3], out: [TOTAL - 3.5, TOTAL], travel: 120 };

const ell = (x, y, cx, cy, a, b) => ((x - cx) / a) ** 2 + ((y - cy) / b) ** 2 <= 1;
const disc = (x, y, cx, cy, r) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r;

function huAt(x, y) {
  if (x * x + y * y > 1) return HU.air;
  if (disc(x, y, 0, -0.42, 0.13)) return HU.bone;
  if (disc(x, y, -0.12, 0.22, 0.1)) return HU.lesion;
  if (ell(x, y, -0.36, 0.08, 0.24, 0.36) || ell(x, y, 0.36, 0.08, 0.24, 0.36)) return HU.lung;
  if (ell(x, y, 0, 0, 0.78, 0.61)) return HU.soft;
  if (ell(x, y, 0, 0, 0.86, 0.68)) return HU.fat;
  return HU.air;
}

const angleOf = (i) => (2 * Math.PI * i) / N_ANG;
const binT = (k) => -1 + ((k + 0.5) * 2) / N_BIN;

function projections() {
  const rows = [];
  for (let i = 0; i < N_ANG; i++) {
    const c = Math.cos(angleOf(i)), s = Math.sin(angleOf(i));
    const row = new Float64Array(N_BIN);
    for (let k = 0; k < N_BIN; k++) {
      const t = binT(k);
      const half = Math.sqrt(Math.max(0, 1 - t * t));
      let sum = 0;
      for (let u = -half; u <= half; u += DS) sum += huAt(t * c - u * s, t * s + u * c) + 1000;
      row[k] = sum * DS;
    }
    rows.push(row);
  }
  return rows;
}

// Ram-Lak ramp filter, applied as a discrete convolution in detector bins.
const KERNEL = (() => {
  const h = new Float64Array(2 * N_BIN - 1);
  for (let n = -(N_BIN - 1); n <= N_BIN - 1; n++) {
    h[n + N_BIN - 1] = n === 0 ? 1 / (4 * BIN * BIN) : n % 2 ? -1 / (Math.PI ** 2 * n * n * BIN * BIN) : 0;
  }
  return h;
})();

function filter(row) {
  const out = new Float64Array(N_BIN);
  for (let k = 0; k < N_BIN; k++) {
    let sum = 0;
    for (let j = 0; j < N_BIN; j++) sum += row[j] * KERNEL[k - j + N_BIN - 1];
    out[k] = sum * BIN;
  }
  return out;
}

const pixelXY = (col, row) => [-1 + ((col + 0.5) * 2) / GRID, 1 - ((row + 0.5) * 2) / GRID];
const inside = (col, row) => {
  const [x, y] = pixelXY(col, row);
  return x * x + y * y <= 1;
};

// Filtered back-projection, one angle at a time so the image can build up on screen.
const SCALE = Math.PI / N_ANG;
function backprojectAngle(img, filtered, i) {
  const c = Math.cos(angleOf(i)), s = Math.sin(angleOf(i));
  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      if (!inside(col, row)) continue;
      const [x, y] = pixelXY(col, row);
      const t = x * c + y * s;
      const u = (t + 1) / BIN - 0.5;
      const k = Math.floor(u);
      const f = u - k;
      const a = k >= 0 && k < N_BIN ? filtered[k] : 0;
      const b = k + 1 >= 0 && k + 1 < N_BIN ? filtered[k + 1] : 0;
      img[row * GRID + col] += (a * (1 - f) + b * f) * SCALE;
    }
  }
}

function reconstructUpTo(filtered, count) {
  const img = new Float64Array(GRID * GRID);
  for (let i = 0; i < count; i++) backprojectAngle(img, filtered[i], i);
  return img;
}

const huOf = (value) => value - 1000;

function tissueOf(hu) {
  if (hu < -500) return "air or lung";
  if (hu < -20) return "fat";
  if (hu < 150) return "soft tissue";
  return "bone";
}

const PROBES = [
  { name: "spine", x: 0, y: -0.42 },
  { name: "lung", x: -0.36, y: 0.08 },
  { name: "lesion", x: -0.12, y: 0.22 },
  { name: "soft tissue", x: 0, y: -0.1 },
  { name: "fat", x: 0, y: 0.645 },
  { name: "air", x: 0.9, y: 0.6 },
];

const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const ease = (t) => {
  t = clamp(t);
  return t * t * (3 - 2 * t);
};
const span = (T, [a, b]) => clamp((T - a) / (b - a));

function stateAt(T) {
  const time = clamp(T, 0, TOTAL - 1e-6);
  let stage = STARTS.findIndex((start, i) => time >= start && time < start + STAGES[i].dur);
  if (stage < 0) stage = STAGES.length - 1;
  const inRotate = span(time, [ROTATE.from, ROTATE.to]);
  const rotating = time >= ROTATE.from && time < ROTATE.to;
  const theta = rotating ? 2 * Math.PI * inRotate : time >= ROTATE.to ? 2 * Math.PI : 0;
  const inReconAt = (time - RECON.from) / (RECON.to - RECON.from);
  const reconCount = time < RECON.from ? 0 : time >= RECON.to ? N_ANG : Math.floor(clamp(inReconAt) * N_ANG);
  const sinoCount = time < ROTATE.from ? 0 : time >= ROTATE.to ? N_ANG : Math.floor(inRotate * N_ANG) + 1;
  const beam = rotating ? ease(span(time, [ROTATE.from, ROTATE.from + 0.4])) * (1 - ease(span(time, [ROTATE.to - 0.4, ROTATE.to]))) : 0;
  const tableIn = ease(span(time, TABLE.in));
  const tableOut = ease(span(time, TABLE.out));
  const dx = -TABLE.travel * (1 - tableIn) - TABLE.travel * tableOut;
  const angleIndex = rotating ? Math.min(N_ANG - 1, Math.floor(inRotate * N_ANG)) : sinoCount ? Math.min(N_ANG - 1, sinoCount - 1) : 0;
  const probeT = stage === 4 ? span(time, [STARTS[4], STARTS[4] + STAGES[4].dur - 0.5]) : 0;
  const probeIndex = Math.min(PROBES.length - 1, Math.floor(probeT * PROBES.length));
  const degrees = Math.round(((theta * 180) / Math.PI) % 360);
  return {
    stage,
    time,
    theta,
    beam,
    dx,
    sinoCount,
    reconCount,
    angleIndex,
    degrees,
    probe: PROBES[probeIndex],
    tableMm: Math.round(-dx * 0.5),
  };
}

const DATA = {"P":{"origin":[364.1443905106326,319.2627883407532],"scale":1.4762575605153887,"azimuth":52,"elevation":26},"GEO":{"zc":86,"housing":76,"half":32,"bore":46,"rotor":44,"img":30,"spot":38.5,"det":42.5,"tubeR":3.2,"cells":24,"travel":120,"base":{"x":-180,"y":-62,"w":300,"d":124,"r":6},"baseH":10,"table":{"x":-44,"y":-28,"w":72,"d":56,"r":2},"tableT":4,"patient":{"a":25.8,"b":20.4,"half":22},"column":{"x":-42,"y":-12,"w":8,"d":24,"r":1}},"TABLE_TOP":65.6};
// Live layer: one clock T through the scan. Everything is redrawn from stateAt(T) and the model's data.
const { P, GEO } = DATA;
const root = document.querySelector(".ct-stage");
const svg = root.querySelector("svg");
const q = (sel) => svg.querySelector(sel);
const beamEl = q("[data-beam]");
const tubeEl = q("[data-tube]");
const cellsEl = q("[data-cells]");
const ledEl = q("[data-led]");
const tubesEl = q("[data-tubes]");
const topEl = q("[data-top]");
const colEl = q("[data-col]");
const slotA = q("[data-pa]");
const slotB = q("[data-pb]");
const playBtn = document.querySelector("[data-play]");
const scrub = document.querySelector("[data-scrub]");
const stepBtns = [...document.querySelectorAll("[data-stage]")];
const profileLine = document.querySelector("[data-profile-line]");
const angleEl = document.querySelector("[data-angle]");
const sinoCount = document.querySelector("[data-sino-count]");
const sinoCanvas = document.querySelector("[data-sino]");
const reconCanvas = document.querySelector("[data-recon]");
const reconWrap = document.querySelector(".ct-recon-wrap");
const probeEl = document.querySelector("[data-probe]");
const huEl = document.querySelector("[data-hu]");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const C = [0, 0, GEO.zc];
const CELLS = GEO.cells;
const CELL_W = (2 * GEO.img) / CELLS;
const LED_AT = [-GEO.half, 0, GEO.zc + GEO.housing - 14];

const rows = projections();
const filtered = rows.map(filter);
const peak = Math.max(...rows.map((row) => Math.max(...row)));
const toScreen = (p) => iso(p, P);

// Point on the rotor: radius r from the axis, at angle phi from the detector side (phi = PI is the tube side).
function onRotor(th, r, phi, x = 0) {
  const cp = Math.cos(phi), sp = Math.sin(phi), ct = Math.cos(th), st = Math.sin(th);
  return [x, C[1] + r * (-cp * ct - sp * st), C[2] + r * (-cp * st + sp * ct)];
}
const tangentOf = (th) => [0, -Math.sin(th), Math.cos(th)];

function hullOfPoints(points) {
  const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}

function tubePath(th) {
  const pts = [];
  const T = tangentOf(th);
  for (const r of [GEO.spot + 1, GEO.spot + 6]) {
    const base = onRotor(th, r, Math.PI);
    for (let i = 0; i < 16; i++) {
      const a = (2 * Math.PI * i) / 16;
      const p = base.map((v, j) => v + GEO.tubeR * (Math.cos(a) * (j === 0 ? 1 : 0) + Math.sin(a) * T[j]));
      pts.push(toScreen(p));
    }
  }
  return pathOf(hullOfPoints(pts), true);
}

function beamPath(th) {
  const phiMax = Math.asin(GEO.img / GEO.det);
  const tri = [onRotor(th, GEO.spot, Math.PI), onRotor(th, GEO.det, phiMax), onRotor(th, GEO.det, -phiMax)].map(toScreen);
  return pathOf(tri, true);
}

const cellEls = Array.from({ length: CELLS }, () => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
  el.setAttribute("class", "ct-cell");
  cellsEl.appendChild(el);
  return el;
});

function cellPath(th, index) {
  const s0 = -GEO.img + index * CELL_W;
  const s1 = s0 + CELL_W;
  const phi0 = Math.asin(s0 / GEO.det), phi1 = Math.asin(s1 / GEO.det);
  const pts = [];
  for (const phi of [phi0, phi1]) {
    for (const r of [GEO.det - 1.2, GEO.det + 1.2]) {
      for (const x of [-3, 3]) pts.push(toScreen(onRotor(th, r, phi, x)));
    }
  }
  return pathOf(hullOfPoints(pts), true);
}

function cellValue(row) {
  const values = [];
  const group = rows[0].length / CELLS;
  for (let c = 0; c < CELLS; c++) {
    let sum = 0;
    for (let j = 0; j < group; j++) sum += rows[row][c * group + j];
    values.push(sum / group / peak);
  }
  return values;
}

const sinoCtx = sinoCanvas.getContext("2d");
const sinoImage = sinoCtx.createImageData(rows[0].length, rows.length);
for (let i = 0; i < rows.length; i++) {
  for (let j = 0; j < rows[i].length; j++) {
    const o = (i * rows[i].length + j) * 4;
    const v = Math.round(255 * Math.min(1, rows[i][j] / peak));
    sinoImage.data[o] = v;
    sinoImage.data[o + 1] = v;
    sinoImage.data[o + 2] = v;
    sinoImage.data[o + 3] = 255;
  }
}
let sinoDrawn = -1;
function drawSino(count) {
  if (count === sinoDrawn) return;
  sinoDrawn = count;
  const data = new ImageData(new Uint8ClampedArray(sinoImage.data), sinoImage.width, sinoImage.height);
  for (let i = count; i < rows.length; i++) {
    for (let j = 0; j < rows[i].length; j++) data.data[(i * rows[i].length + j) * 4 + 3] = 0;
  }
  sinoCtx.putImageData(data, 0, 0);
  sinoCount.textContent = String(count);
}

const reconCtx = reconCanvas.getContext("2d");
const reconImage = reconCtx.createImageData(GRID, GRID);
let recon = { count: 0, img: new Float64Array(GRID * GRID) };
function reconTo(count) {
  if (count < recon.count) recon = { count: 0, img: new Float64Array(GRID * GRID) };
  for (; recon.count < count; recon.count++) backprojectAngle(recon.img, filtered[recon.count], recon.count);
}
let reconDrawn = -1;
function windowed(hu) {
  const lo = WINDOW.level - WINDOW.width / 2;
  return Math.round(255 * Math.max(0, Math.min(1, (hu - lo) / WINDOW.width)));
}
function valueAt(col, row) {
  const gain = recon.count ? N_ANG / recon.count : 1;
  return huOf(recon.img[row * GRID + col] * gain);
}
function drawRecon(count) {
  reconTo(count);
  if (count === reconDrawn) return;
  reconDrawn = count;
  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const o = (row * GRID + col) * 4;
      const within = count > 0 && inside(col, row);
      const v = within ? windowed(valueAt(col, row)) : 0;
      reconImage.data[o] = v;
      reconImage.data[o + 1] = v;
      reconImage.data[o + 2] = v;
      reconImage.data[o + 3] = within ? 255 : 0;
    }
  }
  reconCtx.putImageData(reconImage, 0, 0);
}

function drawProfile(row, count) {
  if (!count) {
    profileLine.setAttribute("points", "");
    return;
  }
  const pts = Array.from(rows[row], (v, j) => `${(j + 0.5).toFixed(2)},${(58 - (v / peak) * 54).toFixed(2)}`);
  profileLine.setAttribute("points", pts.join(" "));
}

function tableShift(dx) {
  const a = toScreen([dx, 0, 0]);
  const b = toScreen([0, 0, 0]);
  return [a[0] - b[0], a[1] - b[1]];
}

function drawRotor(s) {
  const th = s.theta;
  const on = s.beam;
  beamEl.setAttribute("d", on > 0.001 ? beamPath(th) : "");
  beamEl.style.opacity = on.toFixed(3);
  tubeEl.setAttribute("d", tubePath(th));
  const values = s.sinoCount ? cellValue(s.angleIndex) : cellValue(0);
  cellEls.forEach((el, index) => {
    el.setAttribute("d", cellPath(th, index));
    const v = values[index];
    el.style.opacity = (0.4 + 0.6 * Math.min(1, v * 1.25) * (on > 0.001 ? on : 0)).toFixed(3);
  });
  const [lx, ly] = toScreen(LED_AT);
  ledEl.setAttribute("cx", lx.toFixed(2));
  ledEl.setAttribute("cy", ly.toFixed(2));
  ledEl.toggleAttribute("data-on", on > 0.5);
}

const probeAt = (x, y) => {
  const col = ((x + 1) * GRID) / 2 - 0.5;
  const row = ((1 - y) * GRID) / 2 - 0.5;
  return { col, row };
};
let hover = null;
function placeProbe(col, row) {
  probeEl.hidden = false;
  probeEl.style.left = `${((col + 0.5) / GRID) * 100}%`;
  probeEl.style.top = `${((row + 0.5) / GRID) * 100}%`;
}
function describe(col, row, label) {
  const hu = Math.round(valueAt(col, row) / 10) * 10;
  huEl.textContent = `${label}${hu} HU, ${tissueOf(hu)}`;
}

let T = still.matches ? STARTS[4] + 2 : 0;
let playing = !still.matches;
const setPlaying = (on) => {
  playing = on;
  playBtn.textContent = on ? "Pause" : "Play";
};
setPlaying(playing);

function layer(s) {
  const inBore = s.dx > -20;
  const tubeFront = depthOf(onRotor(s.theta, GEO.spot, Math.PI), P) > depthOf(C, P);
  const back = tubeFront ? [] : [tubesEl];
  const front = tubeFront ? [cellsEl, tubesEl] : [cellsEl];
  if (inBore) {
    slotA.replaceChildren(...back, topEl, ...front);
    slotB.replaceChildren(colEl);
  } else {
    slotA.replaceChildren(...back, ...front);
    slotB.replaceChildren(topEl, colEl);
  }
}

function render(s) {
  const [sx, sy] = tableShift(s.dx);
  const shift = `translate(${sx.toFixed(2)} ${sy.toFixed(2)})`;
  topEl.setAttribute("transform", shift);
  colEl.setAttribute("transform", shift);
  layer(s);
  drawRotor(s);
  drawSino(s.sinoCount);
  drawRecon(s.reconCount);
  drawProfile(s.angleIndex, s.sinoCount);
  angleEl.textContent = `${s.degrees}°`;
  readout.textContent = `${STAGES[s.stage].label} · ${s.degrees}° · table ${s.tableMm} mm out`;
  stepBtns.forEach((btn, i) => btn.setAttribute("aria-pressed", String(i === s.stage)));
  scrub.value = String(s.time);
  scrub.setAttribute("aria-valuetext", STAGES[s.stage].label);
  if (hover) {
    placeProbe(hover.col, hover.row);
    describe(hover.col, hover.row, "");
  } else if (s.stage === 4 && reconCanvas) {
    const { col, row } = probeAt(s.probe.x, s.probe.y);
    placeProbe(Math.round(col), Math.round(row));
    describe(Math.round(col), Math.round(row), `${s.probe.name}: `);
  } else {
    probeEl.hidden = true;
    huEl.textContent = s.stage < 3 ? "The reconstruction starts after the scan." : "Hover the slice to read a value.";
  }
}

reconWrap.addEventListener("pointermove", (event) => {
  const rect = reconCanvas.getBoundingClientRect();
  const col = Math.floor(((event.clientX - rect.left) / rect.width) * GRID);
  const row = Math.floor(((event.clientY - rect.top) / rect.height) * GRID);
  hover = col >= 0 && row >= 0 && col < GRID && row < GRID && inside(col, row) ? { col, row } : null;
});
reconWrap.addEventListener("pointerleave", () => {
  hover = null;
});

playBtn.addEventListener("click", () => setPlaying(!playing));
stepBtns.forEach((btn) => btn.addEventListener("click", () => {
  T = STARTS[Number(btn.dataset.stage)] + 0.02;
  setPlaying(false);
  render(stateAt(T));
}));
scrub.addEventListener("input", () => {
  T = Number(scrub.value);
  setPlaying(false);
  render(stateAt(T));
});
root.addEventListener("keydown", (event) => {
  if (event.key === " ") {
    event.preventDefault();
    setPlaying(!playing);
  }
});

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) T = (T + dt) % TOTAL;
  render(stateAt(T));
  requestAnimationFrame(tick);
}
render(stateAt(T));
requestAnimationFrame(tick);
</script></body></html>
